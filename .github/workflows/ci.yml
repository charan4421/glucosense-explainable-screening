name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff pytest
      - name: Lint
        run: ruff check .
      # Plain `pip install torch` on Linux pulls the CUDA toolkit (several GB) and the runner
      # runs out of disk ("No space left on device"). The tests need CPU torch only.
      - name: Install CPU-only torch
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project deps
        run: pip install --no-cache-dir -r requirements.txt
      - name: Test (synthetic data, no downloads)
        run: pytest -q
      - name: Demo (scores the sample patient with the committed portable model)
        run: python scripts/demo.py
